auth:
  image: python:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.auth
    args:
      NODE_ENV: production
  ports:
    - "5000:5000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=3600
  volumes:
    - auth_data:/var/lib/data
  restart: unless-stopped


validator:
  image: python:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.validator
    args:
      NODE_ENV: production
  ports:
    - "5000:5000"
  environment:
    - LOG_LEVEL=DEBUG
    - CACHE_TTL=600
  volumes:
    - validator_data:/var/lib/data
  restart: unless-stopped
