modal:
  image: nginx:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.modal
    args:
      NODE_ENV: production
  ports:
    - "8000:8000"
  environment:
    - LOG_LEVEL=DEBUG
    - CACHE_TTL=60
  volumes:
    - modal_data:/var/lib/data
  restart: unless-stopped


model:
  image: alpine:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.model
    args:
      NODE_ENV: production
  ports:
    - "4000:4000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=600
  volumes:
    - model_data:/var/lib/data
  restart: unless-stopped
